<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jachtseizoen HQ Pro</title>
    
    <!-- Leaflet Kaart CSS & JS (Essentiële basiskaarten) -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>

    <!-- Firebase Legacy SDK -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #121212; color: white; text-align: center; }
        .container { padding: 15px; max-width: 600px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; box-sizing: border-box; }
        h1 { color: #ff3b30; margin: 10px 0; font-size: 24px; text-transform: uppercase; letter-spacing: 1px; }
        button { background: #ff3b30; color: white; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; margin: 10px; width: 80%; text-transform: uppercase; }
        button.secondary { background: #007aff; }
        button.success { background: #34c759; }
        button.danger { background: #ff3b30; }
        #map { flex-grow: 1; width: 100%; border-radius: 12px; margin-top: 15px; min-height: 300px; border: 2px solid #333; }
        .status { margin: 5px 0; font-size: 15px; color: #aaa; background: #222; padding: 10px; border-radius: 6px; font-weight: bold; }
        .timer-box { font-size: 24px; color: #ffcc00; font-weight: bold; margin: 5px 0; background: #1a1a1a; padding: 5px; border-radius: 6px; border: 1px solid #ffcc00; }
        .hidden { display: none !important; }
        .control-panel { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
        .control-panel button { width: 45%; padding: 10px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Jachtseizoen HQ</h1>
        
        <!-- ROL SELECTIE SCHERM -->
        <div id="role-selection">
            <p>Kies je rol in de jacht:</p>
            <button onclick="startSpel('boef')">Ik ben de BOEF</button>
            <button class="secondary" onclick="startSpel('jager')">Ik ben de JAGER</button>
        </div>

        <!-- LIVE SPEL INTERFACE -->
        <div id="game-screen" class="hidden" style="display: flex; flex-direction: column; flex-grow: 1;">
            <div id="status-veld" class="status">Kaart en database laden...</div>
            <div id="timer-veld" class="timer-box hidden">VOLGENDE PING: --:--</div>
            
            <div id="map"></div>

            <!-- JAGER BEDIENINGSPANEL -->
            <div id="jager-controls" class="control-panel hidden">
                <button class="success" onclick="setSpelStatus('bezig')">Start Spel</button>
                <button class="danger" onclick="setSpelStatus('afgelopen')">Stop Spel</button>
            </div>
        </div>
    </div>

    <script>
        // JOUW EIGEN FIREBASE CONFIG HIERONDER INSTELLEN:
        var firebaseConfig = {
            apiKey: "AIzaSyCD2C9n2e5h6Lq01O0coNsa57aMNQD0-zQ",
            authDomain: "jachtseizoenspel.firebaseapp.com",
            projectId: "jachtseizoenspel",
            storageBucket: "jachtseizoenspel.firebasestorage.app",
            messagingSenderId: "481310839419",
            appId: "1:481310839419:web:b5dfd5234c75fa662908de"
        };

        // Firebase opstarten
        firebase.initializeApp(firebaseConfig);
        var db = firebase.firestore();

        var map, mijnLocatieMarker, boefMarker;
        var spelerRol = '';
        var gpsWatcher = null;
        var countdownInterval = null;
        var PING_INTERVAL_MINUTEN = 5; 

        function startSpel(rol) {
            spelerRol = rol;
            document.getElementById('role-selection').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');

            if (spelerRol === 'jager') {
                document.getElementById('jager-controls').classList.remove('hidden');
                document.getElementById('timer-veld').classList.remove('hidden');
            }

            // 1. Start de kaart op basiscoördinaten (centreren we direct op)
            map = L.map('map').setView([52.1326, 5.2913], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);

            // 2. JOUW GOOGLE MAP OVERLAP INLADEN (Zonder externe plugins)
            fetch('doc.kml')
                .then(res => res.text())
                .then(kmltext => {
                    const parser = new DOMParser();
                    const kmlDoc = parser.parseFromString(kmltext, 'text/xml');
                    
                    // We vissen handmatig alle getekende coördinaten uit jouw doc.kml bestand
                    const coordinatesNodes = kmlDoc.getElementsByTagName('coordinates');
                    let bounds = L.latLngBounds();

                    for (let i = 0; i < coordinatesNodes.length; i++) {
                        const coordsString = coordinatesNodes[i].textContent.trim();
                        const coordsArray = coordsString.split(/\s+/);
                        const latLngs = [];

                        coordsArray.forEach(coord => {
                            const parts = coord.split(',');
                            if (parts.length >= 2) {
                                const lng = parseFloat(parts[0]);
                                const lat = parseFloat(parts[1]);
                                if (!isNaN(lat) && !isNaN(lng)) {
                                    const point = [lat, lng];
                                    latLngs.push(point);
                                    bounds.extend(point);
                                }
                            }
                        });

                        // Als het een lijn of grens is, teken hem direct rood op de kaart
                        if (latLngs.length > 1) {
                            L.polyline(latLngs, {color: 'red', weight: 4, opacity: 0.7}).addTo(map);
                        } else if (latLngs.length === 1) {
                            // Als het een losse POI/marker zone is
                            L.circle(latLngs[0], {radius: 100, color: 'blue', fillColor: '#30a', fillOpacity: 0.2}).addTo(map);
                        }
                    }
                    
                    // Zoom de kaart automatisch perfect in op jouw getekende KML grenzen
                    if (bounds.isValid()) {
                        map.fitBounds(bounds);
                    }
                })
                .catch(err => {
                    document.getElementById('status-veld').innerText = "Let op: doc.kml kon niet gelezen worden.";
                    console.error(err);
                });

            // 3. Volg ALTIJD de eigen locatie van de telefoon (Blauwe stip)
            volgEigenLocatie();

            // 4. Luister naar de Centrale Spelstatus in de Cloud
            luisterNaarSpelStatus();
        }

        // Functie voor de Jager om de status aan te passen
        function setSpelStatus(nieuweStatus) {
            db.collection("spellen").doc("status_id").set({
                status: nieuweStatus,
                startTijd: nieuweStatus === 'bezig' ? firebase.firestore.FieldValue.serverTimestamp() : null
            }, { merge: true });
        }

        function luisterNaarSpelStatus() {
            db.collection("spellen").doc("status_id").onSnapshot(function(docSnap) {
                var status = "wachten";
                var startTijd = null;
                
                if (docSnap.exists) {
                    status = docSnap.data().status || "wachten";
                    startTijd = docSnap.data().startTijd;
                }

                if (status === 'wachten') {
                    document.getElementById('status-veld').innerText = "Wachten tot de Jager het spel start...";
                    stopGpsVerzending();
                    clearInterval(countdownInterval);
                } 
                else if (status === 'bezig') {
                    document.getElementById('status-veld').innerText = "HET SPEL IS BEZIG!";
                    if (spelerRol === 'boef') {
                        startGpsVerzending();
                    } else if (spelerRol === 'jager') {
                        startTimerSysteem(startTijd);
                    }
                } 
                else if (status === 'afgelopen') {
                    document.getElementById('status-veld').innerText = "HET SPEL IS BEËINDIGD!";
                    document.getElementById('timer-veld').innerText = "SPEL AFGELOPEN";
                    stopGpsVerzending();
                    clearInterval(countdownInterval);
                }
            });
        }

        function volgEigenLocatie() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(function(position) {
                    var lat = position.coords.latitude;
                    var lng = position.coords.longitude;

                    if (mijnLocatieMarker) {
                        mijnLocatieMarker.setLatLng([lat, lng]);
                    } else {
                        var blauwIcoon = L.icon({
                            iconUrl: 'https://google.com',
                            iconSize:,
                            iconAnchor: [12, 12]
                        });
                        mijnLocatieMarker = L.marker([lat, lng], {icon: blauwIcoon}).addTo(map).bindPopup("Jij hier").openPopup();
                    }
                    }, function(err) { console.log("GPS toegang geweigerd."); }, { enableHighAccuracy: true });
}
}
function startGpsVerzending() {
if (gpsWatcher) return;
gpsWatcher = navigator.geolocation.watchPosition(function(position) {
var lat = position.coords.latitude;
var lng = position.coords.longitude;
document.getElementById('status-veld').innerText = "🚨 JE WORDT GEJAAGD! Locatie verzenden...";
db.collection("spellen").doc("jachtseizoen1").set({
boef_lat: lat,
boef_lng: lng,
tijdstip: new Date().getTime()
}, { merge: true });
}, function(err) { alert("Zet je GPS aan!"); }, { enableHighAccuracy: true });
}
function stopGpsVerzending() {
if (gpsWatcher) {
navigator.geolocation.clearWatch(gpsWatcher);
gpsWatcher = null;
}
}
function startTimerSysteem(startTijd) {
if (!startTijd) return;
clearInterval(countdownInterval);
var boefRef = db.collection("spellen").doc("jachtseizoen1");
countdownInterval = setInterval(function() {
var nu = new Date().getTime();
var startMillis = startTijd.toDate().getTime();
var verstrekenSec = Math.floor((nu - startMillis) / 1000);
var intervalSec = PING_INTERVAL_MINUTEN * 60;
var resterendeSec = intervalSec - (verstrekenSec % intervalSec);
var minuten = Math.floor(resterendeSec / 60);
var seconden = resterendeSec % 60;
document.getElementById('timer-veld').innerText = "VOLGENDE PING: " +
(minuten < 10 ? "0" : "") + minuten + ":" + (seconden < 10 ? "0" : "") + seconden;
if (resterendeSec === intervalSec || !boefMarker) {
boefRef.get().then(function(doc) {
if (doc.exists) {
var data = doc.data();
updateBoefMarkerOpKaart(data.boef_lat, data.boef_lng);
}
});
}
}, 1000);
}
function updateBoefMarkerOpKaart(lat, lng) {
document.getElementById('status-veld').innerText = "BOEF LOCATIE GEUPDATE! (5 min Ping)";
if (boefMarker) {
boefMarker.setLatLng([lat, lng]);
} else {
var roodIcoon = L.icon({
iconUrl: 'google.com',
iconSize:,
iconAnchor: [12, 12]
});
boefMarker = L.marker([lat, lng], {icon: roodIcoon}).addTo(map).bindPopup("BOEF GESPOT!").openPopup();
}
}
